name: Bug report
description: Something in Temper doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems (isolation, secrets, auth) go to a private report instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste exact error text.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. temper project add …
        2. …
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and evidence
      description: Gate reports, run events, `temper status` output. Remove secrets and private repository names first.
      render: text
  - type: input
    id: version
    attributes:
      label: Temper commit
      description: Output of `git rev-parse --short HEAD`, or the release tag from `temper status`.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: macOS 15, Node 24, claude CLI 2.x
    validations:
      required: true
