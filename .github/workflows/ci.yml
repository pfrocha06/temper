name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: git config --global user.email ci@example.com && git config --global user.name ci

      # The gate sandbox (srt) runs for real on every platform, so isolation is tested, not assumed.
      # macOS needs nothing: sandbox-exec is built in.
      - name: Install the Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq bubblewrap socat ripgrep
          # Ubuntu 24.04 strips capabilities from unprivileged user namespaces; bubblewrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo TEMPER_TEST_SRT=1 >> "$GITHUB_ENV"
      - name: Install the Windows sandbox
        if: runner.os == 'Windows'
        run: |
          pnpm --filter @temper/server exec srt windows-install
          pnpm --filter @temper/server exec node ../../scripts/warm-windows-sandbox.mjs
          echo TEMPER_TEST_SRT=1 >> "$GITHUB_ENV"

      # The Codex adapter's permission profile, enforced by Codex's own sandbox (no login needed).
      - name: Install the Codex CLI
        run: |
          npm install -g @openai/codex@0.166.0
          mkdir -p "$HOME/.codex-test"
          home="$HOME/.codex-test"
          if [ "$RUNNER_OS" = Windows ]; then home="$(cygpath -w "$home")"; fi
          echo TEMPER_TEST_CODEX=1 >> "$GITHUB_ENV"
          echo "TEMPER_TEST_CODEX_HOME=$home" >> "$GITHUB_ENV"
      - name: Set up the Codex Windows sandbox
        if: runner.os == 'Windows'
        run: codex sandbox setup --elevated --current-user --codex-home "$TEMPER_TEST_CODEX_HOME"

      - run: pnpm check

  # The one-line installers, run for real against this commit on every platform.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # actions/checkout leaves a detached HEAD; give the installer a branch to clone.
      - run: git checkout -q -B ci-install
      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TEMPER_REPO="$GITHUB_WORKSPACE" TEMPER_REF=ci-install sh install.sh
          TEMPER_REPO="$GITHUB_WORKSPACE" TEMPER_REF=ci-install sh install.sh  # again: the update path
          ~/.local/bin/temper help
      - name: install.ps1 (Windows PowerShell 5.1, as `irm | iex` runs it)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:TEMPER_REPO = $env:GITHUB_WORKSPACE; $env:TEMPER_REF = "ci-install"
          Get-Content install.ps1 -Raw | Invoke-Expression
          Get-Content install.ps1 -Raw | Invoke-Expression
          temper help

